name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Worker, Dashboard, Deployment]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the endpoint or page, the request id (X-Request-ID) if you have it, and any error.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
