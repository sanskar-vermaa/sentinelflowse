name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint and tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  api-postgres:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelflow_test
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: sentinelflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelflow"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sentinelflow:sentinelflow@localhost:5432/sentinelflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Migrations apply cleanly to PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://sentinelflow:sentinelflow@localhost:5432/sentinelflow_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e apps/api pytest
      - run: pytest
        working-directory: apps/worker

  web:
    name: Dashboard lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [api, api-postgres, worker, web]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for the API
        run: for i in $(seq 1 60); do curl -fs localhost:8000/api/v1/health/ready && break; sleep 2; done
      - name: Register, ingest two alerts and check they were grouped
        run: |
          set -e
          API=localhost:8000/api/v1
          ORG=$(curl -fs -X POST $API/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","display_name":"CI","password":"ci-password-123","organization_name":"CI Org"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["organization_id"])')
          TOKEN=$(curl -fs -X POST $API/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          AUTH="Authorization: Bearer $TOKEN"
          KEY=$(curl -fs -X POST $API/organizations/$ORG/api-keys -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"ci"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["secret"])')
          curl -fs -X POST $API/organizations/$ORG/workflows -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"Page","trigger":"incident.created","definition":{"steps":[{"type":"notify","channel":"on-call"}]}}'
          for id in a1 a2; do
            curl -fs -X POST $API/alerts/ingest -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
              -d "{\"source\":\"monitor\",\"external_id\":\"$id\",\"title\":\"High error rate\",\"payload\":{\"service\":\"checkout\"}}"
          done
          COUNT=$(curl -fs $API/organizations/$ORG/incidents -H "$AUTH" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')
          test "$COUNT" = "1"
          # The worker executes the queued workflow run.
          for i in $(seq 1 30); do
            RUNS=$(curl -fs $API/organizations/$ORG/dashboard/summary -H "$AUTH" | python3 -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"])')
            STATUS=$(docker compose exec -T postgres psql -U sentinelflow -tAc "select status from workflow_runs limit 1")
            [ "$STATUS" = "succeeded" ] && break; sleep 2
          done
          test "$STATUS" = "succeeded"
      - name: Dashboard serves pages
        run: curl -fs localhost:3000/login | grep -q SentinelFlow
      - if: failure()
        run: docker compose logs
