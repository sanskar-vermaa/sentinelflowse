[project]
name = "sentinelflow-worker"
version = "1.0.0"
description = "Background worker for SentinelFlow: executes queued workflow runs."
requires-python = ">=3.11"
dependencies = ["sentinelflow-api"]

[tool.pytest.ini_options]
pythonpath = [".", "../api"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinelflow_worker*"]
